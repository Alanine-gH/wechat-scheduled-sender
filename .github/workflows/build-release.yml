name: build-release

# 触发方式：**仅手动触发**（workflow_dispatch）。
#
# 为什么不监听 tag 推送（曾经的坑，务必别改回去）：
# 本地打包后用 `gh release create` 发布时，gh 会**创建并推送 v* tag**，
# 于是这里被自动触发。而 CI 里的 package.json 版本恒为 1.0.0
# （版本号只在本地 build.js 构建期间临时改写），结果：
#   1) CI 额外产出一个 WeChatSender-1.0.0-x64.exe，
#      被 action-gh-release 自动追加到同一个 Release 上 ——
#      Release 里就多了一个版本号错误的包（实测 v1.5.0/v1.6.0/v1.7.0 都中招）
#   2) 更严重：vendor/python 被 .gitignore 排除，CI 里**没有内置 Python**，
#      它产出的安装包需要目标机自己装 Python —— 是个残废包，却被发布了
#   3) action-gh-release 还会用它的通用文案**覆盖**手写的发布说明
#      （那段文案还写着「需要已安装 Python 3.9+」，早已过时）
#
# 所以发布统一走本地：
#   准备内嵌Python.bat  ->  打包.bat <版本>  ->  gh release create ...
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布 Release（默认只上传 Artifact 供验证）'
        type: boolean
        default: false
      version:
        description: '版本号，用于 Release 标签（例如 v1.5.0）'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 云端构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm install
        env:
          # CI 在美国节点，直接用官方源即可（本地开发用 npmmirror，见 build.js）
          ELECTRON_BUILDER_BINARIES_MIRROR: ''

      - name: 确保 Electron 二进制就绪
        # npm 11 可能拦截 electron 的 postinstall，导致没有 dist/electron.exe。
        # 这里显式补跑一次安装脚本，任何 npm 版本下都能拿到二进制。
        shell: pwsh
        run: |
          $exe = 'node_modules/electron/dist/electron.exe'
          if (Test-Path $exe) {
            Write-Host "Electron 已就绪: $exe"
          } else {
            Write-Host "Electron 二进制缺失，补跑 install.js ..."
            Push-Location node_modules/electron
            node install.js
            Pop-Location
          }
          if (-not (Test-Path $exe)) {
            throw "Electron 二进制仍不可用，无法打包"
          }

      - name: 打包（NSIS 安装包）
        run: npm run dist
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: ''
          # 不签名：没有证书。产物双击时 Windows 会提示「未知发布者」。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 上传 Artifact（每次构建都可用）
        uses: actions/upload-artifact@v4
        with:
          name: WeChatSender-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ inputs.version }}'
          if (-not $tag) { throw "必须填 version（例如 v1.5.0）" }
          if (-not $tag.StartsWith('v')) { $tag = 'v' + $tag }
          Write-Host "Release 标签: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 发布 Release
        # 只在手动触发且勾选 publish_release 时发布。
        # 注意：CI 里没有 vendor/python（被 .gitignore 排除），
        # 这样产出的安装包需要目标机自备 Python —— 想发布自包含包请走本地打包。
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: WeChatSender ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            微信定时群发控制台 —— Windows x64 安装包（CI 构建）

            **注意：CI 构建的包不含内置 Python**，目标电脑需自备 Python 3.9+。
            需要「开箱即用」的自包含包，请下载同一版本的本地构建产物。

            **使用前请注意**
            - 需要本机已登录微信 4.x（桌面版）
            - 安装到可写目录（例如 `D:\WeChatSender`），不要装在 `C:\Program Files`
            - 安装包未做代码签名，Windows 可能提示「未知发布者」

            详见 [README](https://github.com/${{ github.repository }}#readme)
          files: |
            dist/*.exe
            dist/*.blockmap